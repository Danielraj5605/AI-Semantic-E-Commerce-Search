<!doctype html>
<html lang="en" prefix="schema: http://schema.org/ dcterms: http://purl.org/dc/terms/">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0a0b0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap"
    />

    <title>CatalogueGraph — AI semantic e-commerce search over a knowledge graph</title>
    <meta
      name="description"
      content="A relational product catalogue exposed as a knowledge graph: URIs, an OWL class hierarchy, schema.org descriptions, and Turtle / RDF-XML / JSON-LD serialisations, searched by meaning."
    />

    <!-- Dublin Core metadata for the document itself (Unit 1: annotation). -->
    <meta name="dcterms.title" content="CatalogueGraph" />
    <meta name="dcterms.subject" content="Semantic Web; RDF; OWL; SPARQL; semantic search" />
    <meta name="dcterms.type" content="InteractiveResource" />

    <!--
      The application injects a second application/ld+json block describing the
      current result set. This one describes the application itself, so the page
      is self-describing even before a query is run.
    -->
    <script type="application/ld+json">
      {
        "@context": "http://schema.org/",
        "@type": "WebApplication",
        "name": "CatalogueGraph",
        "applicationCategory": "Semantic Web demonstrator",
        "description": "Publishes a relational product catalogue as RDF and retrieves from it by meaning rather than by string matching.",
        "about": [
          { "@type": "Thing", "name": "Resource Description Framework" },
          { "@type": "Thing", "name": "Web Ontology Language" },
          { "@type": "Thing", "name": "SPARQL" },
          { "@type": "Thing", "name": "Semantic search" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
